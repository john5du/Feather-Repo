name: Update All Repos JSON

on:
  schedule:
    # 北京时间每天 07:00 / 19:00（UTC 23:00 / 11:00）
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update all JSON files
        id: update_all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/update_repos.py
          python scripts/merge_apps.py

      - name: Commit and push all changes
        if: success()
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add app/*.json all.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          CHANGED_FILES=$(git diff --staged --name-only | tr '\n' ' ' | sed 's/ $//')
          git commit -m "chore: update JSON files with latest release info - Updated files: ${CHANGED_FILES}"
          git push origin HEAD
